<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>CSS Blossoming Flowers | @code_zenith.ai</title>
  <link rel="stylesheet" href="./style.css">

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;}
body{overscroll-behavior:none;}
.birthday-message{position:absolute;top:7vh;left:0;z-index:20;width:100%;text-align:center;pointer-events:none;font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:2px;color:#c9f3ff;text-shadow:0 0 8px rgba(201,243,255,.95),0 0 20px rgba(95,210,255,.78),0 4px 12px rgba(0,0,0,.9)}
.birthday-line{margin:0;line-height:.95;opacity:0;position:relative;top:0;will-change:transform,top;}
.birthday-line.happy{font-size:clamp(48px,15vw,98px);transform:translateX(-120vw);animation:happyFromLeft 1.15s cubic-bezier(.22,.8,.3,1) 1s forwards,smallTextMove 3.8s ease-in-out 2.25s infinite}
.birthday-line.bday{font-size:clamp(36px,11.5vw,76px);margin-top:14px;transform:translateX(120vw);animation:bdayFromRight 1.15s cubic-bezier(.22,.8,.3,1) 1.45s forwards,smallTextMove 4.1s ease-in-out 2.7s infinite}
.birthday-line.gopu{font-size:clamp(50px,16vw,105px);margin-top:14px;transform:translateY(-120vh);animation:gopuFromTop 1.25s cubic-bezier(.22,.8,.3,1) 1.9s forwards,smallTextMove 3.6s ease-in-out 3.25s infinite}
.birthday-icons{margin-top:18px;display:flex;justify-content:center;align-items:center;gap:22px;font-size:clamp(34px,10vw,58px);opacity:0;animation:iconsIn 1s ease-out 2.7s forwards}
.birthday-heart{color:#fff;font-family:Arial,sans-serif;text-shadow:0 0 12px #fff,0 0 28px rgba(210,240,255,.9);animation:gentleFloat 2.5s ease-in-out 3.7s infinite}
.birthday-fairy{filter:drop-shadow(0 0 9px rgba(220,245,255,.9));animation:gentleFloat 2.8s ease-in-out 3.8s infinite reverse}
@keyframes happyFromLeft{0%{opacity:0;transform:translateX(-120vw)}100%{opacity:1;transform:translateX(0)}}
@keyframes bdayFromRight{0%{opacity:0;transform:translateX(120vw)}100%{opacity:1;transform:translateX(0)}}
@keyframes gopuFromTop{0%{opacity:0;transform:translateY(-120vh)}100%{opacity:1;transform:translateY(0)}}
@keyframes iconsIn{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
@keyframes gentleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes smallTextMove{0%,100%{top:0}50%{top:-2px}}
@media(max-height:700px){.birthday-message{top:4vh}}
</style>

</head>
<body class="not-loaded">
